name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        run: |
          version=$(jq -r .version world.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in world.json"
            exit 1
          fi

      - name: Build the package zip
        run: zip -r "$RUNNER_TEMP/polaris.zip" . -x ".git/*" ".github/*" ".gitignore"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/polaris.zip" world.json
          --title "$GITHUB_REF_NAME" --generate-notes
